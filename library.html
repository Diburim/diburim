<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torah Library · Diburim</title>
  <meta name="description" content="Browse the Diburim Torah library by sefer, parashah, holiday, halachah, hashkafa, series, and calendar.">
  <link rel="icon" href="assets/logo-diburim.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Frank+Ruhl+Libre:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="library">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html"><img class="wordmark-logo" src="assets/logo-diburim.jpg" alt="Diburim — Reflections on Sefer Devarim · Rabbi Binyamin Goldberg" width="184" height="54"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">Menu</span><span></span><span></span><span></span></button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <a href="library.html" data-nav="library">Library</a>
        <a href="projects.html" data-nav="projects">Projects</a>
        <a href="videos.html" data-nav="videos">Videos</a>
        <a href="shulchan-aruch.html" data-nav="shulchan">Shulchan Aruch</a>
        <a href="about.html" data-nav="about">About</a>
      </nav>
      <div class="header-tools">
        <a class="icon-btn" href="search.html" aria-label="Search the library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16.5L20.5 21"/></svg></a>
      </div>
    </div>
  </header>
  <main id="content" class="section wrap">
    <header class="page-hero page-hero--library">
      <h1>Torah Library</h1>
      <p class="lede library-editorial">The shelves — built to hold hundreds of pieces without becoming a pile. <span id="library-total" class="muted"></span></p>
      <label class="sr-only" for="library-search-top">Search the library</label>
      <input id="library-search-top" class="search-input library-search-top" type="search" placeholder="Search titles, parshiyot, topics">
    </header>
    <section class="library-spotlight" id="library-this-week" aria-live="polite" hidden></section>
    <div class="library-layout">
      <aside class="side-card side-card--sefer">
        <h2>Browse by Sefer</h2>
        <ul class="side-list">
          <li><button type="button" data-sefer="Bereishis">Bereishis <span class="count"></span></button></li>
          <li><button type="button" data-sefer="Shemos">Shemos <span class="count"></span></button></li>
          <li><button type="button" data-sefer="Vayikra">Vayikra <span class="count"></span></button></li>
          <li><button type="button" data-sefer="Bamidbar">Bamidbar <span class="count"></span></button></li>
          <li><button type="button" data-sefer="Devarim">Devarim <span class="count"></span></button></li>
          <li><button type="button" data-sefer="Halachah">Halachah <span class="count"></span></button></li>
        </ul>
      </aside>
      <div class="library-main">
        <h2 class="library-section-title">All Torah</h2>
        <input id="library-search" class="search-input sr-only" type="search" placeholder="Search titles, parshiyot, topics" tabindex="-1" aria-hidden="true">
        <div class="filters filters--scroll" role="toolbar" aria-label="Browse">
          <button class="chip" type="button" data-filter="browse" data-value="">All</button>
          <button class="chip" type="button" data-filter="browse" data-value="sefer">Sefer</button>
          <button class="chip" type="button" data-filter="browse" data-value="parsha">Parsha</button>
          <button class="chip" type="button" data-filter="browse" data-value="holiday">Holiday</button>
          <button class="chip" type="button" data-filter="browse" data-value="halacha">Halacha</button>
          <button class="chip" type="button" data-filter="browse" data-value="hashkafa">Hashkafa</button>
          <button class="chip" type="button" data-filter="browse" data-value="series">Series</button>
          <button class="chip" type="button" data-filter="browse" data-value="calendar">Calendar</button>
        </div>
        <div id="calendar-panel" class="calendar-list" hidden></div>
        <p class="results-meta" id="results-meta"></p>
        <div class="index-list" id="results"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap legal"><span>© 2026 Rabbi Binyamin Goldberg · Diburim</span><span><a href="index.html">Home</a></span></div>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/shulchan.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
